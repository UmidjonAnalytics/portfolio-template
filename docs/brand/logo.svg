<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PortfolioPro monogram: two interlocking P's. The back P is the warm accent; a see-through gap
       is cut out of it around the white front P, so they read as "PP" and as two stacked pages. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3b3c"/>
      <stop offset="1" stop-color="#0f8b8d"/>
    </linearGradient>
    <path id="p" fill-rule="evenodd" d="M0 0 H92 a84 84 0 0 1 0 168 H52 V262 a26 26 0 0 1 -52 0 Z M52 50 V118 H90 a34 34 0 0 0 0 -68 Z"/>
    <mask id="gap" maskUnits="userSpaceOnUse" x="-50" y="-50" width="400" height="400">
      <rect x="-50" y="-50" width="400" height="400" fill="#fff"/>
      <use href="#p" fill="#000" stroke="#000" stroke-width="24" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(104 100)">
    <g mask="url(#gap)">
      <use href="#p" x="124" y="26" fill="#ff9a4d"/>
    </g>
    <use href="#p" fill="#ffffff"/>
  </g>
</svg>
